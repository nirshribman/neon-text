/* neon-text v1.1.0 - scene styles
   Everything is scoped to .neon-scene and driven by custom properties set on
   that element (never on :root), so several signs can share a page. */

.neon-scene {
  position: relative;
  overflow: hidden;
  background: #070708;
  --nc: #ff2d95;      /* current glow colour            */
  --br: 55%;          /* bloom radius                   */
  --bx: 50%;          /* bloom centre, % across scene   */
  --px: 50%;          /* pool centre - the lit centroid, not the loudest letter */
  --pool: 0;          /* floor light intensity          */
  --room: 1;          /* wall/floor/vignette presence   */
  --wall: #17171b;    /* wall tint                      */
  --floor: 74%;       /* ground line, % down the scene  */
  --ref: .2;          /* reflection opacity             */
}
.neon-scene > * { position: absolute; }

/* back wall - neon needs a plane to fall on, not a void */
.neon-wall {
  inset: 0; z-index: 0;
  background:
    radial-gradient(120% 80% at 50% 38%, var(--wall) 0%, #0b0b0d 58%, #070708 100%),
    linear-gradient(#0a0a0c, #050506);
}
/* ground. No hard seam: it has to arrive as a gradient, or it reads as a
   rectangle pasted over the wall. */
.neon-floor {
  left: 0; right: 0; top: calc(var(--floor) - 9%); bottom: 0; z-index: 1;
  opacity: var(--room);
  background: linear-gradient(rgba(20,20,24,0) 0%, #0d0d10 26%, #08080a 60%, #050506 100%);
}
.neon-canvas { display: block; inset: 0; z-index: 2; }

/* the pool of light thrown onto the floor. Its top edge MUST be masked - a
   radial gradient clipped by a box edge draws a hard rule across the scene. */
.neon-pool {
  left: 0; right: 0; top: var(--floor); height: 52%; z-index: 3;
  pointer-events: none; mix-blend-mode: screen;
  opacity: calc(var(--pool) * var(--room));
  background: radial-gradient(58% 100% at var(--px) 0%, var(--nc) 0%, transparent 72%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 22%, #000 60%, transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0%, #000 22%, #000 60%, transparent 100%);
}

/* the tube: real DOM text, one span per character, three stacked layers */
.neon-off, .neon-lit { inset: 0; z-index: 4; pointer-events: none; }
.neon-off span, .neon-lit span, .neon-ref span { position: absolute; white-space: pre; }
.neon-off span { color: #212125; text-shadow: 0 1px 0 rgba(255,255,255,.05); }
/* both start dark and are lit per frame by the engine. The reflection needs the
   same default as the lit layer - without it, any frame the engine doesn't
   reach renders the reflection at FULL strength over an unlit sign. */
.neon-lit span, .neon-ref span { opacity: 0; }

/* reflection: foreshortened about the ground line, blurred, masked to a fade */
.neon-refwrap {
  inset: 0; z-index: 3; pointer-events: none; opacity: var(--room);
  -webkit-mask-image: linear-gradient(to bottom, transparent var(--floor), #000 calc(var(--floor) + 2%), transparent 100%);
          mask-image: linear-gradient(to bottom, transparent var(--floor), #000 calc(var(--floor) + 2%), transparent 100%);
}
.neon-ref { inset: 0; filter: blur(3.5px); opacity: var(--ref); }

.neon-vig {
  inset: 0; z-index: 6; pointer-events: none; opacity: var(--room);
  background: radial-gradient(75% 65% at 50% 45%, transparent 40%, rgba(0,0,0,.72) 100%);
}
.neon-grain {
  inset: 0; z-index: 7; pointer-events: none;
  opacity: calc(.045 * var(--room)); mix-blend-mode: overlay;
}
/* the sign lighting its surroundings. Scene-scoped by default - a library has
   no business flashing the host page. */
.neon-bloom {
  inset: 0; z-index: 8; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(circle at var(--bx) 44%, var(--nc) 0%, transparent var(--br));
}

  random:   'Same, in scrambled order - a sign wiring itself up.',
  wave:     'All lit, with a pulse of light travelling along the tube.',
  assemble: 'Particles fly in and build the letterform, then it ignites.',
  trace:    'Light runs along the tube, filling the letterforms as it goes.',

/* Which options require which work. Getting this wrong is silent: a slider
   moves, the value stores, and nothing on screen changes. */
var BUILD_KEYS    = ['text','font','size','track','dots','hue','glow','core'];
var SCHEDULE_KEYS = ['mode','gap'];
var ROOM_KEYS     = ['room','wall','reflect'];

/** Update options. Rebuilds only what the change actually requires.
 *  A font that isn't loaded yet is fetched and the sign rebuilds on arrival;
 *  await Neon.loadFont(name) first if you need it to be synchronous. */
Sign.prototype.set = function(opts){
  opts = opts || {};
  if (opts.mode && !MODES[opts.mode]) throw new Error('neon: unknown mode "' + opts.mode + '"');
  var changed = [], self = this;
  for (var k in opts) if (k in DEFAULTS){
    if (this.o[k] !== opts[k]) changed.push(k);
    this.o[k] = opts[k];
  }
  if (!changed.length) return this;
  this.coreRGB = hex2rgb(this.o.core);

  if (changed.indexOf('font') >= 0){
    var sys = SYS_FONTS.indexOf(this.o.font) >= 0,
        /* if the face is already available, apply it synchronously - kicking
           off another async load would rebuild + replay LATER and stomp on
           whatever the caller does next (it silently reset the frame counter
           mid-capture) */
        ready = sys || (document.fonts && document.fonts.check('400 110px "' + this.o.font + '"'));
    this.fontWeight = sys ? 700 : 400;
    var want = this.o.font;
    if (!ready) loadFont(want).then(function(r){
      /* same stale-arrival guard as the constructor path */
      if (self._dead || self.o.font !== want) return;
      self.fontWeight = r.ok ? r.weight : 700;
      self.capsOnly = !!r.caps;
      self.build(); self.replay();
    });
  }
  var hit = function(list){ return list.some(function(k2){ return changed.indexOf(k2) >= 0; }); };
  if (hit(BUILD_KEYS))    this.build();
  else if (hit(SCHEDULE_KEYS)) this._schedule();
  if (hit(ROOM_KEYS))     this._applyRoom();
  if (changed.indexOf('mode') >= 0 || changed.indexOf('text') >= 0) this.replay();
  return this;
};

/** Apply a named look from Neon.LOOKS. Resets unlisted values to defaults -
 *  a look lists only what it changes, so merging its diff onto live options
 *  lets the previous look bleed through. */
Sign.prototype.look = function(name){
  var k = LOOKS[name];
  if (!k) throw new Error('neon: unknown look "' + name + '"');
  var next = {};
  for (var d in DEFAULTS) next[d] = DEFAULTS[d];
  for (var p in k) next[p] = k[p];
  next.text = this.o.text;                       // the text is the user's, not the look's
  return this.set(next);
};

Sign.prototype.resize = function(){
  var r = this.el.getBoundingClientRect();
  this.rect = r;
  var w = Math.max(160, Math.round(r.width)), h = Math.max(120, Math.round(r.height));
  if (w !== this.W || h !== this.H || !this.CH.length){
    this.W = this.canvas.width = this.off.width = w;
    this.H = this.canvas.height = this.off.height = h;
    this.build();
    this.ctx.clearRect(0,0,w,h);

};

Sign.prototype.build = function(){
  if (!this.W) return this;
  var o = this.o, oc = this.oc, W = this.W, H = this.H, self = this;
  var lines = String(o.text).split('|').map(function(s){ return s.length ? s : ' '; });
  var HAS_LS = 'letterSpacing' in oc;
  var size = o.size;
  /* tracking as a FRACTION OF SIZE - with fixed px, total width isn't linear in
     size, the shrink-to-fit undershoots and long strings spill off-stage */
  var track = function(){ return HAS_LS ? o.track / 100 * size : 0; };
  var fontStr = function(){ return self.fontWeight + ' ' + size + 'px "' + o.font + '", sans-serif'; };
  oc.textAlign = 'left'; oc.textBaseline = 'alphabetic';
  var layout = function(){
    oc.font = fontStr();
    return lines.map(function(ln){
      var adv = [], acc = 0;
      Array.from(ln).forEach(function(c){ adv.push(acc); acc += oc.measureText(c).width + track(); });
      return { adv: adv, total: acc - track() };
    });
  };
  var L = layout(), maxW = W * .84, maxH = H * .58;
  for (var i = 0; i < 4; i++){                    // fit BOTH axes
    var mm = oc.measureText('Hg'),
        lhh = (mm.fontBoundingBoxAscent + mm.fontBoundingBoxDescent) * 1.06,
        widest = Math.max.apply(null, L.map(function(l){ return l.total; }).concat([1])),
        s = Math.min(maxW / widest, maxH / (lhh * lines.length), 1.0001);
    if (s > .999) break;
    size = Math.max(12, size * s); L = layout();
  }
  size = Math.floor(size); L = layout();

  var m = oc.measureText('Hg'),
      asc = m.fontBoundingBoxAscent, desc = m.fontBoundingBoxDescent,
      lh = Math.round((asc + desc) * 1.06),
      top = Math.round(H * .43 - lh * lines.length / 2);

  /* Draw each char at its computed x, then sample that line's band. Canvas and
     DOM read from the SAME x list, so the two rendering engines cannot drift
     apart - never render them independently and nudge until they match. */
  oc.clearRect(0,0,W,H); oc.fillStyle = '#fff'; oc.font = fontStr();
  var slots = [];
  lines.forEach(function(ln, li){
    var chars = Array.from(ln), LL = L[li], x0 = (W - LL.total) / 2,
        baseY = top + asc + lh * li, first = slots.length,
        lut = new Int16Array(W).fill(-1);
    chars.forEach(function(c, i){
      var x = x0 + LL.adv[i], w = oc.measureText(c).width;
      oc.fillText(c, x, baseY);
      slots.push({ c:c, x:x, w:w, baseY:baseY, cand:[] });
      for (var p = Math.max(0, Math.floor(x)); p < Math.min(W, Math.ceil(x + w + track())); p++)
        lut[p] = first + i;
    });
    var y1 = Math.max(0, baseY - asc - 2), y2 = Math.min(H, baseY + desc + 2);
    if (y2 <= y1) return;
    var px = oc.getImageData(0, y1, W, y2 - y1).data;
    /* finer sampling at high density: at stride 2 there aren't enough distinct
       target sites for a particle-only letterform, and the extra dots pile onto
       duplicates instead of filling the glyph */
    var STR = o.dots > HEAVY_AT ? 1 : 2;
    for (var y = 0; y < y2 - y1; y += STR)
      for (var x2 = 0; x2 < W; x2 += STR)

  });

  /* Ground line and vertical centring come from measured INK, never from font
     metrics. Metrics describe the em box: "PIC" and "photography" report
     identical ascent/descent and need completely different treatment. Anchor
     the floor to the baseline and the first lowercase descender sinks through
     it and collides with its own reflection. */
  var inkTop = 1e9, inkBot = -1e9;
  slots.forEach(function(s2){ for (var i2 = 1; i2 < s2.cand.length; i2 += 2){

  if (inkBot > inkTop){
    var dy = Math.round(H * .42 - (inkTop + inkBot) / 2);   // centre the ink, not the em box
    if (dy) slots.forEach(function(s2){
      s2.baseY += dy;
      for (var i2 = 1; i2 < s2.cand.length; i2 += 2) s2.cand[i2] += dy;
    });

  this.inkMid = (inkTop + inkBot) / 2;
  /* horizontal ink bounds too: `trace` sweeps light across them, and using the
     real ink rather than the layout box keeps the sweep from starting in empty
     space to the left of the first glyph */
  var inkL = 1e9, inkR = -1e9;
  slots.forEach(function(s2){ for (var i3 = 0; i3 < s2.cand.length; i3 += 2){
    var x = s2.cand[i3]; if (x < inkL) inkL = x; if (x > inkR) inkR = x; } });

  this.inkR = inkR > inkL ? inkR : W;

  this.FLOOR = Math.round(inkBot + (asc + desc) * .09);
  this.el.style.setProperty('--floor', (this.FLOOR / H * 100).toFixed(2) + '%');
  this.elRef.style.transformOrigin = '50% ' + this.FLOOR + 'px';
  this.elRef.style.transform = 'scaleY(' + (-SQUASH) + ')';

  this.elLit.textContent = ''; this.elOff.textContent = ''; this.elRef.textContent = '';
  /* per-character absolute spans cost natural text selection, so the whole
     string is exposed as the accessible name instead */

  var total = slots.reduce(function(a, s2){ return a + s2.cand.length/2; }, 0) || 1;

  this.CH = slots.map(function(s2, i2){
    var hexi = shiftHue(o.glow, o.hue * (slots.length > 1 ? i2/slots.length : 0));
    var mkSpan = function(parent, lit){
      var e = document.createElement('span');
      e.textContent = s2.c;
      e.style.cssText = 'left:' + s2.x + 'px;top:' + (s2.baseY - asc) +
                        'px;line-height:' + (asc + desc) + 'px;font:' + fontStr();
      if (lit){
        /* a pure-white fill on a heavy face reads as a white slab, not a lit
           tube - carry some of the gas colour into the glass itself */
        e.style.color = mix(o.core, hexi, .26);
        e.style.textShadow = '0 0 3px ' + mix(o.core, hexi, .4) + ', 0 0 9px ' + hexi +
          ', 0 0 20px ' + hexi + ', 0 0 42px ' + hexi + ', 0 0 86px ' + hexi + ', 0 0 150px ' + hexi;
      }
      parent.appendChild(e); return e;
    };
    mkSpan(self.elOff, false);
    var span = mkSpan(self.elLit, true), spanR = mkSpan(self.elRef, true);
    var n = s2.cand.length / 2 | 0, want = Math.round(o.dots * (n / total)), dots = [];
    /* Which SITES get used is a shuffle, never a stride. There are ~5x more
       sample sites than dots, so this picks a subset - and `k * 2654435761 % n`
       picks a LATTICE. The candidate list is row-major, so that lattice
       resonates with the row width and prints a comb of vertical stripes
       through any wide, shallow region: the crossbar of a T came out visibly
       corrupt while its stem looked fine. A seeded Fisher-Yates has no
       periodicity to resonate, is deterministic across replays, and costs one
       O(n) pass at build. */
    var ord = new Int32Array(n);
    for (var oi = 0; oi < n; oi++) ord[oi] = oi;
    for (var os = n - 1; os > 0; os--){
      var or2 = hash1(os + i2 * 7919 + 1) * (os + 1) | 0,
          ot = ord[os]; ord[os] = ord[or2]; ord[or2] = ot;
    }
    for (var k = 0; k < want && n; k++){
      /* targets are PRE-ASSIGNED, not nearest-point searched: the text never
         moves, so a fixed dot->target pairing is O(1) per dot instead of
         O(polyline). Past `n` dots the order repeats, so sites stack evenly. */
      var j = ord[k % n],
          p = hash1(k+3) * 6.28, q = hash1(k+5) * 6.28;
      dots.push({ tx: s2.cand[j*2] + (hash1(k) - .5) * 1.8,
                  ty: s2.cand[j*2+1] + (hash1(k+9) - .5) * 1.8,
                  x:0, y:0, vx:0, vy:0, p:p, q:q,
                  rj: hash1(q * 71) - .5, hp: hash1(p * 331) > .55 });
    }
    return { c:s2.c, i:i2, x:s2.x, w:s2.w, span:span, spanR:spanR, dots:dots,

  });
  this.nInked = Math.max(1, this.CH.filter(function(c){ return c.dots.length; }).length);
  /* hard clear on rebuild: the trail buffer still holds the PREVIOUS word's
     particles, and at a slow fade they linger as a ghost of the old text -
     most visibly in the reflection, which is the dimmest layer */
  this.ctx.clearRect(0, 0, W, H);
  this._schedule(); this._scatter(); this._applyRoom();
  return this;
};

/* each character's strike frame - the whole "variety of animation" knob */
Sign.prototype._schedule = function(){
  var o = this.o;
  var inked = this.CH.filter(function(c){ return c.dots.length; });
  var order = inked.map(function(_, k){ return k; });
  if (o.mode === 'random') order.sort(function(a,b){ return hash1(a*17+3) - hash1(b*17+3); });
  inked.forEach(function(c, k){
    if (RM || o.mode === 'instant')  c.t0 = 0;
    else if (o.mode === 'strike')    c.t0 = T_FLASH;
    else if (o.mode === 'assemble')  c.t0 = T_IGNITE;      // shape first, light second
    /* trace and drain sit in the steady state from frame 0 - trace's sweep and
       drain's power cut each own their own window inside _env instead */
    else if (o.mode === 'trace' || o.mode === 'drain') c.t0 = -1e4;
    else if (o.mode === 'broken')    c.t0 = T_OFF;         // quick shared ignition - the failure is the show
    else                             c.t0 = T_OFF + order.indexOf(k) * o.gap;
  });
  this.CH.forEach(function(c){ if (!c.dots.length) c.t0 = 0; });

  /* broken: pick the tired letters ONCE, deterministically, so replay shows the
     same sign failing the same way - a re-roll per replay reads as random noise,
     not as a sign with a specific fault */
  this.CH.forEach(function(c){ c.bad = false; });
  if (o.mode === 'broken' && inked.length){
    var nBad = inked.length > 5 ? 2 : 1,
        ranked = inked.map(function(c, k){ return { c:c, r:hash1(k * 37 + inked.length * 7) }; })
                      .sort(function(a, b){ return a.r - b.r; });
    for (var bi = 0; bi < Math.min(nBad, ranked.length); bi++) ranked[bi].c.bad = true;
  }
};

Sign.prototype._scatter = function(){
  var o = this.o, W = this.W, H = this.H;
  this.CH.forEach(function(ch){
    ch.dots.forEach(function(d){
      /* reduced motion: dots START on target. "Animation off" is not enough -
         the first painted frame has to be the finished, legible sign. */
      if (RM){ d.x = d.tx; d.y = d.ty; d.vx = d.vy = 0; return; }
      /* hug slides the gas between a room-filling haze (0) and glow clinging
         to the letterforms only (1) */
      var ang = hash1(d.p * 977) * 6.28,
          r = o.scatter * (.35 + .65 * hash1(d.q * 613)) * (1 - .82 * o.hug),
          ox = W/2 + (d.tx - W/2) * o.hug, oy = H/2 + (d.ty - H/2) * o.hug;
      d.x = ox + Math.cos(ang) * r * 1.6; d.y = oy + Math.sin(ang) * r * .7;
      d.vx = d.vy = 0;
    });

};

Sign.prototype._applyRoom = function(){
  this.el.style.setProperty('--room', this.o.room);
  this.el.style.setProperty('--wall', this.o.wall);
  this.elRef.style.opacity = .2 * this.o.reflect;
};

/** Restart the sequence from frame 0. Wakes a sign that put itself to sleep
 *  after a finished exit; an explicit pause() stays paused. */
Sign.prototype.replay = function(){
  this.F = 0; this.ARR = 0;
  this._schedule(); this._scatter();
  if (this.ctx) this.ctx.clearRect(0,0,this.W,this.H);
  if (this._sleep){ this._sleep = false; this.resume(); }
  return this;
};

/* per-character light envelope */
Sign.prototype._env = function(ch){
  var o = this.o, F = this.F;

     sign; for an exit it is the dead one - a drain that stays lit under RM
     would never actually take the content off the page */
  if (RM) return EXIT_MODES.indexOf(o.mode) >= 0
    ? { lit:0, k:o.settle, hot:0, boom:0, dim:0 }
    : { lit:1, k:o.settle, hot:0, boom:.06 };

    if (F < T_OFF || !o.pulses) return { lit:0, k:.012, hot:0, boom:0 };
    var u = (F - T_OFF) / (T_STRIKE - T_OFF), slot = u * o.pulses,
        i = Math.floor(slot), fr = slot - i, on = fr < .3,
        amp = (.16 + .20 * (i / Math.max(1, o.pulses - 1))) * (.65 + .35 * hash1(F));
    /* each failed strike visibly yanks the gas toward the tube, so the letters
       are half-formed when the real one lands. Near-zero room bloom here:
       exactly ONE full flash per sequence keeps this clear of WCAG 2.3.1. */
    return { lit: on ? amp : .015, k: on ? .11 : .012, hot:0, boom: on ? amp * .10 : 0 };
  }
  /* assemble: the particles ARE the letterform while it builds. The tube is
     held off, and the dots carry their own visibility (`cold`) so the shape
     reads before any light exists to explain it. */
  if (o.mode === 'assemble' && F < T_IGNITE){
    var v = Math.min(1, F / T_ASM);
    return { lit:.02, k:.006 + .13 * v * v, hot:0, boom:0, tube:0, cold:.20 + .5 * v };
  }
  /* trace: a hot head of light sweeps the measured ink left to right, and each
     letter fills behind it. No per-letter flash - the sweep IS the event, and a
     cascade of strikes on top of it would read as two animations fighting.
     The front deliberately overshoots inkR (the 1.3 window) so the head fades
     off the end instead of popping to the steady state on the last letter. */
  if (o.mode === 'trace' && F < T_TRACE + TRACE_LEN * 1.3){
    var span = Math.max(1, this.inkR - this.inkL),
        front = this.inkL + span * (F - T_TRACE) / TRACE_LEN,
        fill = Math.max(0, Math.min(1, (front - ch.x) / Math.max(1, ch.w))),
        head = Math.exp(-Math.pow((front - (ch.x + ch.w / 2)) / (ch.w * .8 + 24), 2));

     in a loose left-to-right ripple, each with a dying stutter; the spring lets
     go with the light (k -> 0) and `dim` takes the gas itself to nothing -
     lit alone only unlights the dots, it never removes them */
  if (o.mode === 'drain'){
    var du = (F - T_DRAIN - ch.i * 3) / (DRAIN_LEN * .6);
    if (du > 0){
      du = Math.min(1, du);
      /* the stutter is gated past the onset (du > .08) so every letter's FIRST
         visible act is dimming - an instant blackout on one letter scrambles
         the left-to-right ripple - and the dip is capped at .5 for the same
         reason: deader-than-my-neighbour defeats the stagger */
      var flick = du > .08 && du < .3 && hash1(Math.floor(F / 4) * 13 + ch.i * 7) > .45 ? .5 : 1,
          dl = Math.pow(1 - du, 1.6) * flick;

         opacity the crisp DOM stroke otherwise outlives its own glow and a dead
         letter keeps a hot rim around a grey body - two materials dying at two
         rates */
      return { lit: dl, k: o.settle * (1 - du), hot: 0, boom: 0,
               tube: Math.pow(Math.max(0, 1 - du), 1.6),

  if (age < 0)         return { lit:0, k:.012, hot:0, boom:0 };
  if (age < FLASH_LEN) return { lit:1.7, k:.55, hot:1, boom:1 };
  if (age < FLASH_LEN + DECAY_LEN){
    var w = 1 - (age - FLASH_LEN) / DECAY_LEN;
    return { lit: 1 + .55*w, k: o.settle + .3*w, hot:w, boom:w*w };
  }

     letter at rest reads as a rendering fault, not as a tired tube. */
  var lit = (.94 + .06 * Math.sin(F * .045)) *
            (hash1(Math.floor(F/29) + ch.i * 13) > .988 ? .82 : 1), boom = .07;
  if (o.mode === 'wave'){
    var pw = Math.pow(Math.max(0, Math.sin(F * .035 - ch.i * .55)), 6);
    lit += .9 * pw; boom = .05 + .3 * pw;
  }
  /* broken: only the tired letters get the failure cycle - the rest of the sign
     humming steadily is what makes the fault read as a fault. Stutter blocks are
     5 frames (~2.4 flashes/sec average on one letter) to stay clear of the
     WCAG 2.3.1 three-per-second line with margin. */
  if (o.mode === 'broken' && ch.bad){
    var ph = (F + ch.i * 113) % 320;
    if (ph < 150){                       // tired but on: dim, twitchy
      lit *= .82 + .1 * Math.sin(F * .3 + ch.i);
      if (hash1(Math.floor(F / 7) + ch.i * 31) > .9) lit *= .5;
    } else if (ph < 175){                // stutter: fighting to stay lit
      lit = hash1(Math.floor(F / 5) * 17 + ch.i) > .4 ? lit * .9 : .04;
      boom = lit > .5 ? .12 : 0;
    } else if (ph < 275){                // dead, with two failed re-strikes
      var blip = (ph >= 202 && ph < 206) ? .5 : (ph >= 236 && ph < 239) ? .4 : 0;
      lit = .02 + blip; boom = blip * .25;
    } else if (ph < 281){                // catches again - one honest flash
      return { lit:1.5, k:.5, hot:.9, boom:.6 };
    } else {                             // settling back to tired
      var w2 = 1 - (ph - 281) / 39;
      lit = .9 + .4 * w2; boom = .08 + .2 * w2;
    }
  }
  return { lit:lit, k:o.settle, hot:0, boom:boom };
};

Sign.prototype.step = function(){
  var o = this.o, ctx = this.ctx, W = this.W, H = this.H, FLOOR = this.FLOOR;
  if (!W || !this.CH.length) return;
  this.F++;
  var F = this.F;
  this.px += (this.pxT - this.px) * .16; this.py += (this.pyT - this.py) * .16;
  var wide = o.mode === 'strike';

  var fade = o.trail;
  if (wide && F >= T_FLASH && F < T_FLASH + DECAY_LEN)
    fade = 1.2 + (o.trail - 1.2) * ((F - T_FLASH) / DECAY_LEN);
  /* while the shape builds, hold the frame longer so each particle draws a
     STREAK of its flight path - otherwise the assembly reads as a static
     stipple that happens to change, and nothing ever appears to travel */
  if (o.mode === 'assemble' && F < T_IGNITE)
    fade = 3 + (o.trail - 3) * Math.pow(Math.min(1, F / T_ASM), 2);

  /* NO ACCUMULATION. Every frame starts from an empty canvas.
     Trails used to come from fading the previous frame instead of clearing it,
     and every such scheme burns in: fading is PROPORTIONAL (alpha *= 1-a), and
     8-bit rounding means round(1 * 0.914) === 1. Anything that reaches alpha
     1..5 never decays, so wherever a particle has ever been - every path the
     cursor ever pushed one along - keeps a permanent faint smear.
     Trails are drawn explicitly instead, as a motion segment per particle
     (see the stroke below), which is bounded, controllable, and cannot stain. */
  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';       // additive: dense areas burn to a core
  /* streak length, from the old fade scale: a low `trail` meant a slow fade and
     therefore long smears, so it maps to a long segment */
  var streak = Math.max(.4, Math.min(8, 30 / fade));

  var t = F * .012, PR = 150, refl = o.reflect,
      DENS = Math.pow(DENS_REF / Math.max(400, o.dots), DENS_EXP),
      /* vnoise is 8 sin per dot per frame; above the heavy threshold swap to a
         cheap spatial sinusoid - with that many particles the field's fine
         structure isn't legible anyway */
      HEAVY = o.dots > HEAVY_AT,
      tubeMul = (!RM && o.mode === 'assemble' && F < T_IGNITE) ? 0 : 1,
      /* drain progress, 0 -> 1 once the power cuts - drives the per-dot release */
      drain = (!RM && o.mode === 'drain' && F > T_DRAIN)
                ? Math.min(1, (F - T_DRAIN) / DRAIN_LEN) : 0,
      prog = (RM || !wide) ? 9 : (F - T_OFF) / (T_FLASH - T_OFF),
      land = this._land,
      bestBoom = 0, bestCh = null, litSum = 0, litX = 0, hot = [], nArr = 0, nTot = 0;

  for (var ci = 0; ci < this.CH.length; ci++){
    var ch = this.CH[ci];
    if (!ch.dots.length) continue;
    var e = this._env(ch),
        gate = wide ? Math.max(0, Math.min(1, (prog - (ch.x / W) * o.stagger) * 3.2)) : 1,
        /* hugging must survive the DRIFT too: stiffen the unlit spring and calm
           the field, or noise walks the tight cloud back out into a haze */
        k = (e.k + (e.lit < .3 ? .055 * o.hug : 0)) * gate,
        rgb = ch.rgb,
        /* `dim` scales the gas itself (drain, RM exits): lit at 0 still leaves a
           visible unlit haze, and a drained sign must end at actually nothing */
        base = (e.cold != null ? e.cold * .45 : .10 + .30 * Math.min(1.2, e.lit)) *
               (e.dim != null ? e.dim : 1),
        /* per-character, not per-dot: this was recomputed thousands of times a
           frame for a value that only changes with the character's light */
        amp = o.gas * (e.lit > .3 ? .30 : .55) * (1 - .6 * o.hug) * (RM ? .12 : 1),
        dsz = o.dotSize;
    var col = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + (base * DENS).toFixed(3) + ')';
    ctx.fillStyle = col;
    /* one path + one stroke for the whole character: batching the motion
       segments is cheaper than a draw call per particle, and lineWidth/colour
       are per-character constants anyway */
    ctx.strokeStyle = col; ctx.lineCap = 'round';
    ctx.lineWidth = (1.3 + 1.1 * Math.min(1, e.lit) * gate) * o.dotSize;
    ctx.beginPath();
    land.length = 0;

    for (var di = 0; di < ch.dots.length; di++){
      var d = ch.dots[di];
      /* damping .88 -> terminal drift ~ amp/.12 px per frame; keep amp low or
         the unlit cloud walks off the stage before the strike */
      var nx = HEAVY ? Math.sin(d.x * .013 + t * 3 + d.p) * .5 : vnoise(d.x/90, d.y/90 + t) - .5,
          ny = HEAVY ? Math.cos(d.y * .013 + t * 3 + d.q) * .5 : vnoise(d.x/90 + 7, d.y/90 + t + 3) - .5;
      d.vx += (d.tx - d.x) * k + nx * amp + Math.sin(F*.07 + d.p) * o.gas * .06;
      d.vy += (d.ty - d.y) * k + ny * amp + Math.sin(F*.061 + d.q) * o.gas * .06;
      if (this.pOn && o.push && !RM){              // cursor stirs the gas
        var ax = d.x - this.px, ay = d.y - this.py,
            gp = Math.exp(-(ax*ax + ay*ay) / (2*PR*PR));
        d.vx += (ax * .055 - ay * .022) * gp * o.push;
        d.vy += (ay * .055 + ax * .022) * gp * o.push;
      }
      if (drain){
        /* the gas lets go: a gentle per-dot buoyancy, slightly different for
           every particle so the cloud loosens instead of translating. With
           damping .88 the terminal drift tops out near .6px/frame - a slow
           rise, not a launch. */
        d.vy -= (.02 + .05 * hash1(d.p * 53)) * drain;
        d.vx += (hash1(d.q * 91) - .5) * .08 * drain;
      }
      d.vx *= .88; d.vy *= .88; d.x += d.vx; d.y += d.vy;

      var ex = d.x - d.tx, ey = d.y - d.ty, home = ex*ex + ey*ey < 36;
      nTot++; if (home) nArr++;
      var s = (1.3 + 1.1 * Math.min(1, e.lit) * gate) * dsz;
      /* a particle that has FOUND ITS PLACE lights up; one still in flight
         stays dim, so the letterform brightens as it completes */
      if (e.cold != null && home) land.push(d.x, d.y, s);
      else {
        /* the trail, drawn rather than accumulated: a segment back along this
           frame's velocity. At rest the segment collapses and the round cap
           leaves a dot, so still particles look exactly as before. */
        ctx.moveTo(d.x - d.vx * streak, d.y - d.vy * streak);
        ctx.lineTo(d.x, d.y);
      }

      /* at high density reflect only half the dots at double weight - the
         reflection is diffuse by design, so the halved fillRect count is
         invisible in the result and very visible in the frame time */
      if (refl && d.y < FLOOR && (!HEAVY || d.p > 3.14)){
        /* Light lying on a floor, not a mirror image. Three rules, each fixing
           a specific way this looked wrong:
             - FORESHORTENED (SQUASH); a 1:1 mirror just doubles the sign
             - falloff rides ALPHA, never the dot's height, or you get a second
               sign at full brightness
             - falloff and smear scale with HEIGHT ABOVE FLOOR, so the upper
               line of a multi-line sign fades instead of leaving a ghost */
        var depth = FLOOR - d.y, my = FLOOR + depth * SQUASH,
            fall = (1 - (my - FLOOR) / ((H - FLOOR) * .8 + 1)) / (1 + depth / 120);
        if (fall > 0 && my < H){
          ctx.globalAlpha = fall * fall * .3 * refl * DENS * (HEAVY ? 2 : 1);
          ctx.fillRect(d.x + d.rj * (7 + depth * .05), my,
                       s * (2.6 + depth * .015), s * .85);
          ctx.globalAlpha = 1;
        }
      }
      if (e.hot && d.hp) hot.push(d.x, d.y, e.hot);
    }

    ctx.stroke();                                  // all this character's trails, one call
    if (land.length){                              // the settled particles, lit
      ctx.fillStyle = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + (base * 2.6 * DENS).toFixed(3) + ')';
      for (var q2 = 0; q2 < land.length; q2 += 3) ctx.fillRect(land[q2], land[q2+1], land[q2+2], land[q2+2]);
    }
    /* `tube` dials the DOM glass out entirely - at 0 the letterform is nothing
       but particles, in any mode */
    var op = Math.min(1, e.lit) * o.tube * (e.tube != null ? e.tube : 1);
    ch.span.style.opacity = op;
    /* the reflection gets the tube term AGAIN: the floor amplifies the last of
       a dying rim, so mid-drain a thin contour of light hugged the underside
       of letters whose bodies already read as dead grey glass */
    ch.spanR.style.opacity = op * (e.tube != null ? e.tube : 1);
    ch.span.style.filter = e.lit > 1 ? 'brightness(' + (1 + (e.lit - 1) * 1.6) + ')' : 'none';
    litSum += Math.min(1, e.lit);
    litX += Math.min(1, e.lit) * (ch.x + ch.w / 2);
    if (e.boom > bestBoom){ bestBoom = e.boom; bestCh = ch; }
  }

  /* the dead-glass layer sits ABOVE the canvas, so it occludes every dot inside
     the glyph - it has to fade with the tube, or "particles build the
     letterform" only ever shows an outline of the letterform */
  this.elOff.style.opacity = o.tube * tubeMul;

  /* Flash strength is SYNCED TO ASSEMBLY, not just to the clock: a half-formed
     sign flashes softly, a fully-built one flashes hardest, so the light reads
     as caused by the letterform completing rather than timed to coincide with
     it. The tube term gives the particle flash back what a dialled-down tube
     isn't contributing. */
  var arr = nTot ? nArr / nTot : 1;
  this.ARR += (arr - this.ARR) * .25;              // smoothed, so it can't strobe
  var EARN = (.5 + .5 * this.ARR) * (1 + (1 - o.tube) * .9);

  if (hot.length){                                 // white-hot core, strike + decay only
    var cr = this.coreRGB;
    for (var hi = 0; hi < hot.length; hi += 3){
      ctx.fillStyle = 'rgba(' + cr[0] + ',' + cr[1] + ',' + cr[2] + ',' +
        (.55 * o.coreHeat * hot[hi+2] * EARN * DENS).toFixed(3) + ')';
      ctx.fillRect(hot[hi], hot[hi+1], 2.2 * dsz, 2.2 * dsz);
    }
  }

  /* trace: the head is a FREE-FLOATING light drawn into the gas at x = front,
     independent of any letter. Without a carrier the head only exists as a
     per-letter envelope, so it extinguishes in every inter-letter trough and
     dies completely at a word gap - "letters lighting in order", not "light
     travelling". This is the light; the letter envelopes are what it ignites. */
  var headFade = 0, headX = 0, headCh = null;
  if (!RM && o.mode === 'trace'){
    var tu = (F - T_TRACE) / TRACE_LEN;
    if (tu > 0 && tu < 1.3){
      var tspan = Math.max(1, this.inkR - this.inkL);
      headX = this.inkL + tspan * tu;
      headFade = Math.min(1, tu * 14) * (tu > 1 ? Math.max(0, 1 - (tu - 1) / .3) : 1);
      var hbest = 1e9;
      for (var hc = 0; hc < this.CH.length; hc++){
        var cc = this.CH[hc]; if (!cc.dots.length) continue;
        var dxh = Math.abs(headX - (cc.x + cc.w / 2));
        if (dxh < hbest){ hbest = dxh; headCh = cc; }
      }
      if (headCh && headFade > 0){
        var hr = Math.max(46, (this.inkBot - this.inkTop) * .95),
            hy = this.inkMid, hrgb = headCh.rgb, hcr = this.coreRGB,
            /* brighter BETWEEN letters: on a glyph the lit tube carries the
               light, but in a trough the head is all there is - without the
               boost, "light travelling" barely outruns "letters in order" */
            trough = headX < headCh.x || headX > headCh.x + headCh.w ? 1 : 0,
            hAmp = .42 * (1 + .35 * trough),
            /* in a trough the 0-stop itself leans toward glow: boosted pure
               core with no glyph to absorb it reads as a discrete bright point */
            h0 = trough ? [(hcr[0] * 3 + hrgb[0]) >> 2, (hcr[1] * 3 + hrgb[1]) >> 2,
                           (hcr[2] * 3 + hrgb[2]) >> 2] : hcr,
            hg = ctx.createRadialGradient(headX, hy, 0, headX, hy, hr),
            /* mid stop mixing core toward glow: without it the boosted core in
               a letter gap reads as a discrete specular blob floating in space
               rather than the hot centre of a region of gas */
            hmx = [(hcr[0] + hrgb[0]) >> 1, (hcr[1] + hrgb[1]) >> 1, (hcr[2] + hrgb[2]) >> 1];
        hg.addColorStop(0,   'rgba(' + h0[0] + ',' + h0[1] + ',' + h0[2] + ',' + (hAmp * headFade * DENS).toFixed(3) + ')');
        hg.addColorStop(.12, 'rgba(' + hmx[0] + ',' + hmx[1] + ',' + hmx[2] + ',' + (hAmp * .72 * headFade * DENS).toFixed(3) + ')');
        hg.addColorStop(.28, 'rgba(' + hrgb[0] + ',' + hrgb[1] + ',' + hrgb[2] + ',' + (.26 * headFade * DENS).toFixed(3) + ')');
        hg.addColorStop(1,   'rgba(' + hrgb[0] + ',' + hrgb[1] + ',' + hrgb[2] + ',0)');
        ctx.fillStyle = hg;
        ctx.fillRect(headX - hr, hy - hr, hr * 2, hr * 2);
      }
    }
  }

  var st = this.el.style;
  /* the floor pool tracks the LIT CENTROID, not the loudest letter: with every
     letter at the same steady hum the old max() tie-broke to the first char and
     parked the pool at the sign's left edge - a crescent of light with no
     source. --px is separate from --bx so the bloom can still jump to events. */
  var pxT = litSum > .01 ? litX / litSum : W / 2;
  if (this.PX < 0) this.PX = pxT;
  this.PX += (pxT - this.PX) * .1;
  st.setProperty('--px', (this.PX / W * 100).toFixed(1) + '%');
  if (headFade > 0 && headCh){
    /* bloom rides the head continuously - through letter gaps included */
    st.setProperty('--nc', headCh.hex);
    st.setProperty('--br', '17%');
    st.setProperty('--bx', (headX / W * 100).toFixed(1) + '%');
    this.elBloom.style.opacity = Math.min(.3, Math.max(bestBoom * o.flash * EARN * .34,
                                                       .26 * headFade * o.flash));
  } else if (bestCh){
    var bx = wide ? 50 : ((bestCh.x + bestCh.w/2) / W * 100);
    st.setProperty('--nc', bestCh.hex);
    st.setProperty('--br', wide ? '55%' : '17%');
    st.setProperty('--bx', bx.toFixed(1) + '%');
    this.elBloom.style.opacity = Math.min(wide ? .85 : .3,
      bestBoom * o.flash * EARN * (wide ? .8 : .34));
  } else this.elBloom.style.opacity = 0;
  st.setProperty('--pool', (.55 * (litSum / this.nInked)).toFixed(3));

  /* a finished exit goes to sleep: once the drain has fully played out (the
     +60 covers the per-letter stagger and the gas fade tail) there is nothing
     on stage, and stepping thousands of dots of dark physics forever is not an
     ending, it is a leak. replay() wakes it. */
  if (o.mode === 'drain' && F > T_DRAIN + DRAIN_LEN + 60 && !this._sleep){
    this._sleep = true;
    this.pause();
  }
};

Sign.prototype._loop = function(){
  var self = this;
  (function frame(){
    if (self._dead || self._paused) return;
    self.step();
    self._raf = requestAnimationFrame(frame);
  })();
};

/** Stop the render loop. step() still works, so you can drive frames by hand -
 *  which is how a given frame is captured reproducibly. */
Sign.prototype.pause = function(){
  this._paused = true;
  if (this._raf) cancelAnimationFrame(this._raf);
  return this;
};
Sign.prototype.resume = function(){
  if (!this._paused) return this;
  this._paused = false; this._loop(); return this;
};

/** Tear down: stops the loop, removes listeners and empties the container. */
Sign.prototype.destroy = function(){
  this._dead = true;
  if (this._raf) cancelAnimationFrame(this._raf);
  if (this._ro) this._ro.disconnect();
  if (this._onResize) global.removeEventListener('resize', this._onResize);
  this.el.removeEventListener('pointermove', this._onMove);
  this.el.removeEventListener('pointerleave', this._onLeave);
  this.el.classList.remove('neon-scene');
  this.el.textContent = '';
  this.CH = [];
};

global.Neon = {
  version: VERSION,
  create: function(target, opts){
    var el = typeof target === 'string' ? document.querySelector(target) : target;
    if (!el) throw new Error('Neon.create: target not found - ' + target);
    return new Sign(el, opts);
  },
  loadFont: loadFont,
  capsOnly: capsOnly,
  MODES: MODES,
  EXIT_MODES: EXIT_MODES,
  LOOKS: LOOKS,
  DEFAULTS: DEFAULTS,
  SYS_FONTS: SYS_FONTS,
  CAPS_FONTS: CAPS_FONTS,
  DOTS_SMOOTH: DOTS_SMOOTH,
  reducedMotion: RM
};

})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/* The panel is a CONSUMER of the public API - it only ever calls
   sign.set() / .look() / .replay() / .pause(). Nothing here reaches into the
   engine, which is what proves the extraction is real. */

const SLIDERS = [
  ['Colour', 'hue',      'Hue spread',          0,   360, 5,   null ],
  ['Colour', 'coreHeat', 'Core heat',           0,   1,   .05, null ],
  ['Type',   'size',     'Size',                28,  240, 2,   null ],
  ['Type',   'track',    'Letter spacing',      0,   20,  1,   null ],
  ['Type',   'tube',     'Tube opacity',        0,   1,   .05, null ],
  ['Gas',    'dots',     'Dots',                800, 30000,200,null ],
  ['Gas',    'dotSize',  'Dot size',            .5,  3,   .1,  null ],
  ['Gas',    'gas',      'Gas turbulence',      0,   3,   .05, null ],
  ['Gas',    'hug',      'Hug letters',         0,   1,   .05, null ],
  ['Gas',    'settle',   'Settle (spring)',     .02, .3,  .01, null ],
  ['Gas',    'trail',    'Trail fade',          4,   60,  1,   null ],
  ['Room',   'room',     'Room presence',       0,   1,   .05, null ],
  ['Room',   'reflect',  'Reflection',          0,   1,   .05, null ],
  ['Room',   'push',     'Cursor push',         0,   2,   .05, null ],
  ['Timing', 'flash',    'Flash intensity',     0,   1.4, .05, null ],
  ['Timing', 'scatter',  'Start scatter',       0,   400, 10,  null ],
  ['Timing', 'pulses',   'Strike pulses',       0,   3,   1,   ['strike'] ],
  ['Timing', 'stagger',  'Arrival stagger',     0,   .9,  .05, ['strike'] ],
  ['Timing', 'gap',      'Letter gap (frames)', 2,   30,  1,   ['cascade','random','wave'] ],
];
const G_FONTS = ['Monoton','Bungee','Bungee Shade','Bungee Inline','Righteous','Audiowide','Orbitron',
  'Michroma','Syncopate','Tourney','Rubik Mono One','Bowlby One','Alfa Slab One','Anton',
  'Archivo Black','Bebas Neue','Black Ops One','Titan One','Ultra','Staatliches','Six Caps',
  'Faster One','Wallpoet','Iceberg','Codystar','Monofett','Nabla','Nosifer','Rampart One',
  'Silkscreen','Press Start 2P','Vast Shadow','Shrikhand','Fugaz One','Carter One','Lobster',
  'Lobster Two','Pacifico','Great Vibes','Kaushan Script','Sacramento','Satisfy','Yellowtail',
  'Playball','Poiret One','Permanent Marker','Rock Salt','Chewy','Cinzel'];
const PRESETS = ['#ff2d95','#35d6ff','#3dff88','#ffae2b','#b06bff','#ff3b3b','#ffffff'];
const CAPS = new Set(Neon.CAPS_FONTS);

/* ── hash hooks (headless capture) ────────────────────────────────────────────
   #t=TEXT · #mode=cascade · #font=Monoton · #c=ff2d95 · #k=ffffff
   #s=hug:1,dots:9000 · #f=N (run N frames, freeze, hide panel)
   Keys are delimiter-anchored: an unanchored /t=/ also matches the "t=" inside
   "font=Monoton", which silently renders the font name as the sign's text.
   NB changing ONLY the hash does not reload the document - bump a query param
   too, or you screenshot a stale frame and report a bug that isn't there.     */
const hashGet = k => location.hash.match(new RegExp('(?:^|[#&])' + k + '=([^&#]+)'));
const opts = {};
{
  const t = hashGet('t'), m = hashGet('mode'), c = hashGet('c'), k = hashGet('k'), s = hashGet('s');
  if (t) opts.text = decodeURIComponent(t[1]);
  if (m) opts.mode = m[1];
  if (c) opts.glow = '#' + c[1];
  if (k) opts.core = '#' + k[1];
  if (s) s[1].split(',').forEach(kv => { const [a,b] = kv.split(':');
    if (a in Neon.DEFAULTS) opts[a] = +b; });
}
const hashFont = hashGet('font'), hashFreeze = hashGet('f');

const sign = Neon.create('#stage', opts);

/* ── panel ─────────────────────────────────────────────────────────────────── */
const panel = document.getElementById('panel');
panel.insertAdjacentHTML('beforeend', `
  <div class="ttl">neon-text</div>
  <div class="sub">assembly · strike · flash -
    <a href="https://github.com/nirshribman/neon-text" id="repo" target="_blank" rel="noopener">source</a></div>
  <h2>Looks</h2><div id="looks"></div>
  <h2>Text</h2>
  <div class="row"><input type="text" id="txt" maxlength="48" placeholder="type anything…   |  =  new line"></div>
  <div class="row"><select id="fontsel">
    <optgroup label="System - works offline">${Neon.SYS_FONTS.map(f=>`<option>${f}</option>`).join('')}</optgroup>
    <optgroup label="Google - display &amp; script">${G_FONTS.map(f=>
      `<option value="${f}">${f}${CAPS.has(f)?' - caps only':''}</option>`).join('')}</optgroup>
  </select></div>
  <div class="row"><input type="text" id="gfont" placeholder="…or any Google font name ⏎"></div>
  <div id="fstat"></div>
  <h2>Animation</h2><div id="modes"></div><div class="hint" id="modehint"></div>
  <h2>Colour</h2>
  <div id="swatches">${PRESETS.map(c=>`<i data-c="${c}" style="background:${c};color:${c}"></i>`).join('')}</div>
  <div class="row cc">
    <div><small>Glow</small><input type="color" id="glow"></div>
    <div><small>Core</small><input type="color" id="corec"></div>
  </div>`);

/* the active look, or null once any manual change diverges from it - the grid
   must answer "which look am I in", and after an edit the honest answer is none */
let curLook = null;
Object.keys(Neon.LOOKS).forEach(name => {
  const b = document.createElement('button');
  b.textContent = name; b.id = 'look_' + name;
  b.onclick = () => { curLook = name; sign.look(name); syncPanel(); };
  document.getElementById('looks').appendChild(b);
});
Object.keys(Neon.MODES).forEach(name => {
  const b = document.createElement('button');
  b.textContent = name; b.id = 'mode_' + name;
  b.onclick = () => { curLook = null; sign.set({ mode:name }); syncPanel(); };
  document.getElementById('modes').appendChild(b);
});

let group = 'Colour';
for (const [g, key, label, min, max, step] of SLIDERS){
  if (g !== group){ group = g; panel.insertAdjacentHTML('beforeend', `<h2>${g}</h2>`); }
  panel.insertAdjacentHTML('beforeend',
    `<div class="row" id="row_${key}"><label>${label} <output id="o_${key}"></output></label>
     <input type="range" id="${key}" min="${min}" max="${max}" step="${step}"></div>`);
  document.getElementById(key).addEventListener('input', e => {
    curLook = null; sign.set({ [key]: +e.target.value }); readouts(); syncLooks();
  });
}
panel.insertAdjacentHTML('beforeend', `
  <h2>Frame</h2>
  <div class="row"><select id="frame">
    <option value="fill">Fill window</option><option value="16:9">16 : 9 - hero</option>
    <option value="21:9">21 : 9 - banner</option><option value="1:1">1 : 1 - square</option>
    <option value="4:5">4 : 5 - social</option>
  </select></div>
  <div class="acts"><button id="replay">▶ Replay</button>
  <button id="share">Copy link</button><button id="export">Export code</button></div>
  <div class="acts" style="margin-top:6px"><button id="solo">Hide panel</button><button id="reset">Reset</button></div>
  <div class="hint" style="margin-top:12px">Space replay · H panel · move the cursor over the sign</div>`);

document.body.insertAdjacentHTML('beforeend', `
  <div id="exportwrap"><div id="exportdlg" role="dialog" aria-modal="true" aria-labelledby="exporttitle">
    <h3 id="exporttitle">Use this sign on your page</h3>
    <div class="sub">Two files and one call, pinned to this version - everything you've dialled
      in is in the options. The sign is a dark object: give it a dark region of the page
      (its top and bottom edges feather into whatever is behind them).
      Google fonts load automatically.</div>
    <textarea id="exportcode" readonly spellcheck="false"></textarea>
    <div class="acts"><button id="exportcopy">Copy code</button><button id="exportclose">Close</button></div>
  </div></div>`);

/* ── wiring ────────────────────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
function syncLooks(){
  document.querySelectorAll('#looks button').forEach(b =>
    b.classList.toggle('on', b.id === 'look_' + curLook));
}
$('txt').addEventListener('input', e => sign.set({ text: e.target.value }));
$('fontsel').addEventListener('change', e => { curLook = null; setFont(e.target.value); });
$('gfont').addEventListener('change', e => { if (e.target.value.trim()){ curLook = null; setFont(e.target.value.trim()); } });
$('glow').addEventListener('input', e => { curLook = null; sign.set({ glow: e.target.value }); syncLooks(); });
$('corec').addEventListener('input', e => { curLook = null; sign.set({ core: e.target.value }); syncLooks(); });
document.querySelectorAll('#swatches i').forEach(s =>
  s.onclick = () => { curLook = null; sign.set({ glow: s.dataset.c }); $('glow').value = s.dataset.c; syncLooks(); });
$('replay').onclick = () => sign.replay();
$('reset').onclick = () => { curLook = null; sign.set(Neon.DEFAULTS); syncPanel(); sign.replay(); };
$('solo').onclick = toggleSolo;
$('frame').addEventListener('change', e => setFrame(e.target.value));
/* copy feedback must be HONEST: clipboard.writeText rejects on insecure
   contexts and denied permission, and a false "✓ copied" on a copy-paste
   feature sends the user off to paste code they do not have */
async function copyFeedback(btn, text, idle){
  try { await navigator.clipboard.writeText(text); btn.textContent = '✓ copied'; }
  catch (err){ btn.textContent = '✗ press Ctrl+C'; }
  setTimeout(() => btn.textContent = idle, 1400);
}
$('share').onclick = () => {
  const d = Neon.DEFAULTS, o = sign.o;
  const diff = Object.keys(d).filter(k =>
    typeof d[k] === 'number' && o[k] !== d[k]).map(k => k + ':' + o[k]).join(',');
  location.hash = `#t=${encodeURIComponent(o.text)}&mode=${o.mode}` +
    `&font=${encodeURIComponent(o.font)}&c=${o.glow.slice(1)}&k=${o.core.slice(1)}` +
    (diff ? `&s=${diff}` : '');
  copyFeedback($('share'), location.href, 'Copy link');
};
/* ── export: a copy-paste snippet for an external page ─────────────────────────
   Only the diff from DEFAULTS is emitted - the point of the snippet is to be
   READ on the other side, and 25 lines of defaults bury the 4 that matter.
   URLs are PINNED to this engine's version via the jsDelivr tag CDN: an embed
   pointing at mutable files breaks the day the library ships a breaking change,
   and the version comment makes pasted code diagnosable years later. */
const EXPORT_BASE = `https://cdn.jsdelivr.net/gh/nirshribman/neon-text@v${Neon.version}`;
function exportSnippet(){
  const d = Neon.DEFAULTS, o = sign.o, opts = [`    text: ${JSON.stringify(o.text)}`];
  for (const k of Object.keys(d)){
    if (k === 'text' || o[k] === d[k]) continue;
    opts.push(`    ${k}: ${typeof o[k] === 'string' ? JSON.stringify(o[k]) : o[k]}`);
  }
  /* script tags written whole - OPENING ones included - derail THIS page's HTML
     parser mid-string (verified: the document splits into 3 scripts and the
     snippet source renders as page text). Concat keeps the parser out. */
  const ST = '<scr' + 'ipt', SC = '</scr' + 'ipt>';
  /* the mask feathers BOTH edges so the dark room dissolves into the host page
     instead of ending in a razor-straight seam - asymmetric (short ramp on top,
     long fade below) because host content usually sits closer above the sign
     than below it. Emitted as a style block, not an inline attribute: a
     ~205-character div line cannot be read in the snippet's own window, and
     the snippet's point is to be READ. */
  const FADE = 'linear-gradient(transparent, #000 12%, #000 72%, transparent)';
  return `<!-- neon-text v${Neon.version} - github.com/nirshribman/neon-text -->
<link rel="stylesheet" href="${EXPORT_BASE}/src/neon.css">
${ST} src="${EXPORT_BASE}/src/neon.js">${SC}

<style>
  /* top and bottom feather into the host page - asymmetric on purpose:
     host content usually sits closer above the sign than below it */
  #neon-sign{
    width:100%; height:420px;
    mask-image:${FADE};
    -webkit-mask-image:${FADE};
  }
</style>
<div id="neon-sign"></div>
${ST}>
  Neon.create('#neon-sign', {
${opts.join(',\n')}
  });
${SC}`;
}
function openExport(){
  const ta = $('exportcode');
  ta.value = exportSnippet();
  $('exportwrap').classList.add('open');
  /* the Tab trap is keyboard-only; inert makes the background dead to a screen
     reader's virtual cursor too */
  $('panel').inert = true; $('hold').inert = true;
  ta.style.height = 'auto';                        // size to the snippet, not to a guess
  ta.style.height = Math.min(340, ta.scrollHeight + 4) + 'px';
  ta.focus(); ta.select();
}
function closeExport(){
  if (!$('exportwrap').classList.contains('open')) return;
  $('exportwrap').classList.remove('open');
  $('panel').inert = false; $('hold').inert = false;
  $('export').focus();                             // focus returns where it came from
}
$('export').onclick = openExport;
$('exportclose').onclick = closeExport;
$('exportwrap').onclick = e => { if (e.target.id === 'exportwrap') closeExport(); };
$('exportcopy').onclick = () => copyFeedback($('exportcopy'), $('exportcode').value, 'Copy code');

addEventListener('keydown', e => {
  /* Escape first: the modal focuses the textarea on open, so an early return
     for form fields would kill the one key everybody tries */
  if (e.key === 'Escape'){ closeExport(); return; }
  if ($('exportwrap').classList.contains('open') && e.key === 'Tab'){
    /* trap: Tab cycles the dialog, never the obscured panel behind the scrim */
    const ring = [$('exportcode'), $('exportcopy'), $('exportclose')];
    const i = ring.indexOf(document.activeElement);
    e.preventDefault();
    ring[(i + (e.shiftKey ? -1 : 1) + ring.length) % ring.length].focus();
    return;
  }
  /* swallow only what the focused control actually uses: a blanket return for
     BUTTON/range killed the H shortcut after any click until focus moved */
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  /* range sliders pass letters through (H keeps working) but keep Space: a
     user nudging a slider should not trigger a full restart */
  if (e.target.type === 'range' && e.code === 'Space') return;
  if (e.target.tagName === 'SELECT') return;
  if (e.target.tagName === 'BUTTON' && (e.code === 'Space' || e.key === 'Enter')) return;
  if (e.target.id === 'exportcode') return;        // typing/selecting in the snippet
  if (e.code === 'Space'){ e.preventDefault(); sign.replay(); }
  if (e.key.toLowerCase() === 'h') toggleSolo();
});

async function setFont(name){
  const stat = $('fstat');
  stat.style.color = '#5c5c66'; stat.textContent = 'loading ' + name + '…';
  const r = await Neon.loadFont(name);
  if (!r.ok){ stat.style.color = '#c86a6a';
    stat.textContent = `✗ no Google font "${name}" (or offline)`; return; }
  sign.set({ font: name });
  if (r.caps){ stat.style.color = '#d8a05a';
    stat.textContent = `✓ ${name} - caps-only face, lowercase renders as capitals`; }
  else { stat.style.color = '#7fd8c4'; stat.textContent = '✓ ' + name; }
  $('fontsel').value = name;
}

let FRAME = 'fill';
function setFrame(name){
  FRAME = name;
  const hold = $('hold'), stage = $('stage');
  document.body.classList.toggle('framed', name !== 'fill');
  if (name === 'fill'){ stage.style.width = stage.style.height = '100%'; }
  else {
    const [aw, ah] = name.split(':').map(Number), pad = 34,
          s = Math.min((hold.clientWidth - pad*2) / aw, (hold.clientHeight - pad*2) / ah);
    stage.style.width = Math.round(aw * s) + 'px';
    stage.style.height = Math.round(ah * s) + 'px';
  }
  sign.resize();
}
function toggleSolo(){
  /* hiding the panel must not strand keyboard focus on a hidden control */
  if (!document.body.classList.contains('solo') &&
      panel.contains(document.activeElement)) document.activeElement.blur();
  document.body.classList.toggle('solo');
  setTimeout(() => setFrame(FRAME), 30);          // panel width changed → re-fit
}
addEventListener('resize', () => { clearTimeout(window._rt); window._rt = setTimeout(() => setFrame(FRAME), 140); });

function readouts(){
  for (const [, key] of SLIDERS){
    const o = $('o_' + key); if (!o) continue;
    o.textContent = sign.o[key];
    if (key === 'dots'){                          // surface the perf ceiling
      const heavy = sign.o.dots > Neon.DOTS_SMOOTH;
      o.style.color = heavy ? '#d8a05a' : '#d8d8dd';
      o.textContent = sign.o.dots + (heavy ? ' ⚠' : '');
      o.title = heavy ? `above ~${Neon.DOTS_SMOOTH} dots this drops below 60fps` : '';
    }
  }
}
function syncPanel(){
  const o = sign.o;
  for (const [, key, , , , , modes] of SLIDERS){
    const el = $(key); if (!el) continue;
    el.value = o[key];
    const off = modes && !modes.includes(o.mode);
    el.disabled = off; $('row_' + key).style.opacity = off ? .5 : 1;
  }
  $('txt').value = o.text; $('glow').value = o.glow; $('corec').value = o.core;
  $('fontsel').value = o.font;
  document.querySelectorAll('#modes button').forEach(b =>
    b.classList.toggle('on', b.id === 'mode_' + o.mode));
  syncLooks();
  $('modehint').textContent = Neon.MODES[o.mode];
  readouts();
}

/* ── boot ──────────────────────────────────────────────────────────────────── */
(async function(){
  if (hashFont) await setFont(decodeURIComponent(hashFont[1]));
  syncPanel();
  if (hashFreeze && /^\d+$/.test(hashFreeze[1])){
    /* Hiding the panel RESIZES the stage, and the engine's ResizeObserver
       fires asynchronously - after the frame loop below. It would rebuild the
       sign and wipe the frozen frame. So: hide first, let layout and the
       observer settle, and only then drive the frames. */
    $('panel').style.display = 'none';
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    sign.resize();
    sign.pause(); sign.replay();
    const n = +hashFreeze[1];
    for (let i = 0; i < n; i++) sign.step();     // exact frame, reproducible
  }
})();
</script>
